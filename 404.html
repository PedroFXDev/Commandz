<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sistema fora de rota | CommandZ</title>

    <!-- Google Fonts: Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .mascot-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        .mascot-404 {
            max-width: 500px;
            height: auto;
            animation: floating 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(79, 140, 255, 0.2));
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .error-code-bg {
            font-family: var(--font-mono);
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 800;
            color: var(--color-primary-accent);
            line-height: 1;
            margin: 0;
            opacity: 0.03;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            user-select: none;
            pointer-events: none;
        }

        .error-title {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 1rem;
            color: #fff;
        }

        .error-text {
            color: var(--color-gray-500);
            max-width: 550px;
            margin-bottom: 3rem;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        /* Scanline effect intensity for 404 */
        .error-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                    transparent 50%,
                    rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }

        .btn-group-custom {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>

<body class="bg-dark-tech">
    <div class="error-container">
        <div class="mascot-wrapper">
            <div class="error-code-bg">404</div>
            <!-- Certifique-se de salvar o mascote como img/mascote-404.png -->
            <img src="/img/image-removebg-preview (2).png" alt="Mascote 404" class="mascot-404">
        </div>

        <h1 class="error-title fw-bold glitch-text" data-text="STATUS: CONEXÃO_PERDIDA">
            STATUS: CONEXÃO_PERDIDA
        </h1>

        <p class="error-text font-mono">
            <span style="color: #71717A;">// ERROR_LOG: 0x404_ROUTE_NOT_FOUND</span><br>
            O módulo que você está tentando acessar não responde. O destino foi movido, removido ou nunca existiu nesta
            rede.
        </p>

        <div class="btn-group-custom">
            <button onclick="rebootSystem()" class="btn btn-primary-custom px-5">
                reboot_system()
            </button>
        </div>
    </div>

    <!-- Background Grid (Already in body from style.css, but ensuring consistency) -->
    <script>
        function rebootSystem() {
            // Limpa dados de armazenamento local
            localStorage.clear();
            sessionStorage.clear();

            // Adiciona um efeito visual de "reboot" antes de redirecionar
            document.body.style.filter = 'brightness(0)';
            document.body.style.transition = 'filter 0.5s ease';

            setTimeout(() => {
                // Redireciona para a home com parâmetro de cache bust
                window.location.href = 'index.html?cache_clear=' + Date.now();
            }, 500);
        }

        // Simulação de flicker de monitor ocasional
        setInterval(() => {
            if (Math.random() > 0.98) {
                document.body.style.opacity = '0.9';
                setTimeout(() => document.body.style.opacity = '1', 50);
            }
        }, 100);
    </script>
</body>

</html>

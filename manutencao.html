<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas em Calibração | CommandZ</title>

    <!-- Google Fonts: Outfit & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --glass-bg: rgba(18, 18, 26, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(79, 140, 255, 0.4);
        }

        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(79, 140, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(79, 140, 255, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .main-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .maintenance-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            transform: rotateX(2deg);
            animation: card-float 6s ease-in-out infinite;
        }

        @keyframes card-float {
            0%, 100% { transform: rotateX(2deg) translateY(0); }
            50% { transform: rotateX(0deg) translateY(-10px); }
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(79, 140, 255, 0.1);
            border: 1px solid rgba(79, 140, 255, 0.2);
            padding: 8px 18px;
            border-radius: 100px;
            color: var(--color-primary-accent);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 40px;
        }

        .status-pulse {
            width: 6px;
            height: 6px;
            background: var(--color-primary-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-primary-accent);
            animation: status-blink 1.5s ease-in-out infinite;
        }

        @keyframes status-blink {
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .hero-img-container {
            position: relative;
            margin-bottom: 40px;
        }

        .maintenance-img {
            max-width: 450px;
            width: 100%;
            filter: drop-shadow(0 0 30px rgba(79, 140, 255, 0.1));
            transition: transform 0.5s ease;
        }

        .maintenance-card:hover .maintenance-img {
            transform: scale(1.02);
        }

        .title-glitch {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 15px;
            color: #fff;
        }

        .subtitle {
            color: #A1A1AA;
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }

        /* High-end Progress Bar */
        .progress-wrapper {
            max-width: 350px;
            margin: 0 auto;
        }

        .progress-container {
            height: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 88%;
            background: linear-gradient(90deg, #4F8CFF, #8EBAFF);
            box-shadow: 0 0 20px rgba(79, 140, 255, 0.5);
            animation: progress-slide 15s ease-in-out infinite;
        }

        @keyframes progress-slide {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .progress-data {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: #52525B;
            letter-spacing: 0.1em;
        }

        .contact-footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-footer a {
            color: #A1A1AA;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .contact-footer a:hover {
            color: #fff;
        }

        /* Floating particles effect */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--color-primary-accent);
            border-radius: 50%;
            opacity: 0.1;
            animation: particle-move linear infinite;
        }

        @keyframes particle-move {
            to { transform: translateY(-100vh); }
        }
    </style>
</head>

<body>
    <div class="particles" id="particle-container"></div>

    <div class="main-wrapper">
        <div class="maintenance-card">
            <div class="status-pill">
                <span class="status-pulse"></span>
                System Calibration in Progress
            </div>

            <div class="hero-img-container">
                <img src="/Commandz/img/manutencao_mascote.png" alt="Manutenção CommandZ" class="maintenance-img">
            </div>

            <h1 class="title-glitch glitch-text" data-text="OTIMIZANDO_SISTEMA">
                OTIMIZANDO_SISTEMA
            </h1>

            <p class="subtitle">
                Estamos calibrando os últimos circuitos para garantir que sua experiência seja impecável. Voltamos em alguns instantes.
            </p>

            <div class="progress-wrapper">
                <div class="progress-container">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-data">
                    <span>CORE_RESOURCES</span>
                    <span><span id="load-pct">88</span>% COMPLETE</span>
                </div>
            </div>

            <div class="contact-footer">
                <a href="mailto:contato@comandz.com">contato@comandz.com</a>
            </div>
        </div>
    </div>

    <script>
        // Particle generation
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.animationDuration = (Math.random() * 10 + 10) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(p);
        }

        // Percentage simulator
        let pct = 88;
        const pctEl = document.getElementById('load-pct');
        setInterval(() => {
            if (pct < 99) {
                pct += Math.random() > 0.8 ? 1 : 0;
                pctEl.innerText = pct;
            }
        }, 4000);

        // Subtle monitor flicker
        setInterval(() => {
            if (Math.random() > 0.99) {
                document.body.style.opacity = '0.97';
                setTimeout(() => document.body.style.opacity = '1', 30);
            }
        }, 200);
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção de Sistemas | CommandZ</title>

    <!-- Google Fonts: Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .maintenance-hero {
            height: 100vh;
            display: flex;
            align-items: center;
            background: var(--color-bg);
            position: relative;
            overflow: hidden;
        }

        .maintenance-hero::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(79, 140, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .mascot-display {
            position: relative;
            animation: floating 5s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        .tech-status-box {
            border-left: 2px solid var(--color-primary-accent);
            padding-left: 20px;
            margin: 30px 0;
        }

        .progress-mini {
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            width: 200px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-mini-fill {
            height: 100%;
            background: var(--color-primary-accent);
            width: 0%;
            animation: fill-up 4s ease-in-out infinite;
        }

        @keyframes fill-up {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>

<body class="bg-dark-tech">
    <!-- Navbar (Simplified) -->
    <nav class="navbar navbar-expand-lg fixed-top scrolled">
        <div class="container">
            <a class="navbar-brand fw-bold font-mono" href="#">&lt;CommandZ/&gt;<span class="text-primary-accent blink">_</span></a>
        </div>
    </nav>

    <main class="maintenance-hero">
        <div class="container position-relative z-1">
            <div class="row align-items-center">
                <!-- Text Content -->
                <div class="col-lg-7">
                    <div class="tech-badge mb-4 font-mono d-inline-block px-3 py-2 border rounded" style="background: rgba(39,39,42,0.5); border-color: rgba(255,255,255,0.05) !important;">
                        <span style="color: #A1A1AA;">status:</span> <span class="text-white">UNDER_MAINTENANCE</span>;
                    </div>
                    
                    <h1 class="hero-title fw-bold glitch-text" data-text="Estamos recalibrando nossos circuitos." style="font-size: clamp(2.2rem, 4vw, 3.2rem); line-height: 1.15; letter-spacing: -0.5px;">
                        <span class="text-white">Estamos recalibrando</span><br>
                        <span class="text-white">nossos </span><span style="color: #A1A1AA;">circuitos.</span>
                    </h1>
                    
                    <div class="tech-status-box font-mono">
                        <span style="color: #71717A; font-size: 0.9rem;">// Otimizando banco de dados...</span><br>
                        <span style="color: #71717A; font-size: 0.9rem;">// Atualizando protocolos de segurança...</span>
                        <div class="progress-mini"><div class="progress-mini-fill"></div></div>
                    </div>
                    
                    <div class="d-flex flex-column flex-sm-row gap-3 mt-5">
                        <a href="mailto:contato@comandz.com" class="btn btn-primary-custom btn-lg px-4 font-mono">
                            contact_support()
                        </a>
                        <button onclick="window.location.reload()" class="btn btn-outline-custom btn-lg px-4">
                            Verificar status
                        </button>
                    </div>
                </div>

                <!-- Mascot Visual -->
                <div class="col-lg-5 d-none d-lg-block">
                    <div class="mascot-display">
                        <div class="glass-card tech-panel p-4" style="background: rgba(18,18,26,0.6); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 30px 60px rgba(0,0,0,0.5);">
                            <img src="/Commandz/img/manutencao_mascote.png" alt="Mascote em Manutenção" class="img-fluid" style="filter: drop-shadow(0 0 20px rgba(79,140,255,0.2));">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer bg-black-tech text-white border-top border-dark py-4 fixed-bottom">
        <div class="container">
            <p class="text-gray small mb-0 font-mono" style="color: #3F3F46 !important;">// © 2026 CommandZ. Agradecemos a paciência.</p>
        </div>
    </footer>

    <script>
        // Flicker effect
        setInterval(() => {
            if(Math.random() > 0.98) {
                document.body.style.opacity = '0.9';
                setTimeout(() => document.body.style.opacity = '1', 50);
            }
        }, 100);
    </script>
</body>

</html>

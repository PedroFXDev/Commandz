<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas em Calibração | CommandZ</title>

    <!-- Google Fonts: Outfit & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(79, 140, 255, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        .content-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(79, 140, 255, 0.05);
            border: 1px solid rgba(79, 140, 255, 0.15);
            padding: 10px 22px;
            border-radius: 100px;
            color: var(--color-primary-accent);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 50px;
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            background: var(--color-primary-accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--color-primary-accent);
            animation: status-blink 1.5s ease-in-out infinite;
        }

        @keyframes status-blink {
            50% { opacity: 0.2; transform: scale(0.8); }
        }

        .mascot-display {
            position: relative;
            margin-bottom: 40px;
            animation: mascot-float 6s ease-in-out infinite;
        }

        @keyframes mascot-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(1deg); }
        }

        .mascot-img {
            max-width: 300px;
            width: 100%;
            filter: drop-shadow(0 0 40px rgba(79, 140, 255, 0.15));
        }

        .title-main {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            color: #fff;
        }

        .subtitle {
            color: #71717A;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 50px;
            line-height: 1.8;
            font-family: var(--font-mono);
        }

        .progress-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .progress-bar-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 92%;
            background: var(--color-primary-accent);
            box-shadow: 0 0 20px var(--color-primary-accent);
            animation: loading-bar 10s ease-in-out infinite;
        }

        @keyframes loading-bar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: #3F3F46;
            letter-spacing: 0.1em;
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--color-primary-accent);
            border-radius: 50%;
            opacity: 0.1;
            animation: particle-move linear infinite;
        }

        @keyframes particle-move {
            to { transform: translateY(-100vh); }
        }

        .footer-contact {
            position: absolute;
            bottom: 40px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .footer-contact a {
            color: #52525B;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-contact a:hover {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="particles" id="particle-container"></div>

    <div class="content-wrapper">
        <div class="status-pill">
            <span class="status-pulse"></span>
            SYSTEM_CALIBRATION_ACTIVE
        </div>

        <div class="mascot-display">
            <img src="/Commandz/img/manutencao_mascote.png" alt="Mascote CommandZ" class="mascot-img">
        </div>

        <h1 class="title-main glitch-text" data-text="OTIMIZANDO_SISTEMA">
            OTIMIZANDO_SISTEMA
        </h1>

        <p class="subtitle">
            // Estamos recalibrando os circuitos principais.<br>
            // Voltaremos a operar em instantes.
        </p>

        <div class="progress-wrapper">
            <div class="progress-bar-container">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-labels">
                <span>RESOURCES_SYNC</span>
                <span><span id="load-val">92</span>%</span>
            </div>
        </div>

        <div class="footer-contact">
            <a href="mailto:contato@comandz.com">contato@comandz.com</a>
        </div>
    </div>

    <script>
        // Particles
        const container = document.getElementById('particle-container');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 2 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(p);
        }

        // Percentage
        let val = 92;
        const el = document.getElementById('load-val');
        setInterval(() => {
            if (val < 99) {
                val += Math.random() > 0.85 ? 1 : 0;
                el.innerText = val;
            }
        }, 5000);
    </script>
</body>

</html>
